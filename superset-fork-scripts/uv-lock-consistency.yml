# Verifies that requirements/base.txt is a valid, installable lock file.
#
# Earlier iteration used `diff` against a fresh `uv pip compile` regeneration.
# That was too strict: transitive PyPI drift between Devin's session and CI's
# runner produced diffs that weren't Devin's fault (alembic 1.15 → 1.18,
# attrs 25 → 26, etc — new releases between resolve-time-A and resolve-time-B).
# The check failed even when Devin made the correct change, and the
# orchestrator's CI-fix loop then ran in circles trying to chase a moving
# target.
#
# Replacement is semantic: "would pip install this?" Skips transitive
# resolution (--no-deps) so we just verify each pinned version is a real
# downloadable package on PyPI. Tolerates transitive drift; still catches
# fabricated versions, typos, and removed packages.

name: lock file validity

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "requirements/**"
      - ".github/workflows/uv-lock-consistency.yml"
  push:
    branches: [master]
    paths:
      - "pyproject.toml"
      - "requirements/**"

permissions:
  contents: read

jobs:
  validate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --quiet --upgrade pip

      - name: Verify every pin in base.txt is downloadable from PyPI
        # --dry-run + --no-deps: don't actually install anything, don't
        # recurse into transitive resolution. Just confirm every pinned
        # version exists.
        run: |
          python -m pip install --quiet --dry-run --no-deps \
            -r requirements/base.txt
          echo "::notice::requirements/base.txt: every pinned version is real and downloadable"
