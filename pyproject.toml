[project]
name = "devin-maintenance-orchestrator"
version = "0.1.0"
description = "Event-driven control plane that routes GitHub maintenance work to Devin"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.40",
    "pandas>=2.2",
]
dev = [
    "ruff>=0.7",
    "pytest>=8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
